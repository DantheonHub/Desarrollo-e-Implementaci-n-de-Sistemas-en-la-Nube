<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14606b" flood-opacity="0.2"/>
    </filter>
    <style>
      .root { fill: #14606b; }
      .ou { fill: #2f8f9d; }
      .account { fill: #f4a640; }
      .box-text { fill: #ffffff; font-size: 12.5px; text-anchor: middle; font-weight: 600; }
      .line { stroke: #9fb9bd; stroke-width: 1.6; fill: none; }
      .panel { fill: #eaf4f6; stroke: #cfe3e6; stroke-width: 1; }
      .title { fill: #14606b; font-size: 15px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="820" height="420" fill="#ffffff"/>
  <rect x="15" y="15" width="790" height="390" rx="14" class="panel"/>
  <text x="410" y="45" class="title">Jerarquía de AWS Organizations</text>

  <!-- connecting lines first (so boxes sit on top) -->
  <path class="line" d="M 410 90 L 410 115 L 220 115 L 220 140"/>
  <path class="line" d="M 410 115 L 600 115 L 600 140"/>
  <path class="line" d="M 220 180 L 220 205 L 130 205 L 130 230"/>
  <path class="line" d="M 220 205 L 310 205 L 310 230"/>
  <path class="line" d="M 600 180 L 600 205 L 510 205 L 510 230"/>
  <path class="line" d="M 600 205 L 690 205 L 690 230"/>

  <!-- root -->
  <g filter="url(#soft-shadow)">
    <rect x="335" y="60" width="150" height="42" rx="8" class="root"/>
  </g>
  <text x="410" y="86" class="box-text">Cuenta raíz (Root)</text>

  <!-- OUs -->
  <g filter="url(#soft-shadow)">
    <rect x="145" y="140" width="150" height="42" rx="8" class="ou"/>
    <rect x="525" y="140" width="150" height="42" rx="8" class="ou"/>
  </g>
  <text x="220" y="166" class="box-text">Unidad organizativa</text>
  <text x="600" y="166" class="box-text">Unidad organizativa</text>

  <!-- accounts -->
  <g filter="url(#soft-shadow)">
    <rect x="60" y="230" width="140" height="42" rx="8" class="account"/>
    <rect x="240" y="230" width="140" height="42" rx="8" class="account"/>
    <rect x="440" y="230" width="140" height="42" rx="8" class="account"/>
    <rect x="620" y="230" width="140" height="42" rx="8" class="account"/>
  </g>
  <text x="130" y="256" class="box-text">Cuenta AWS</text>
  <text x="310" y="256" class="box-text">Cuenta AWS</text>
  <text x="510" y="256" class="box-text">Cuenta AWS</text>
  <text x="690" y="256" class="box-text">Cuenta AWS</text>

  <!-- legend -->
  <rect x="60" y="330" width="18" height="18" rx="3" class="root"/>
  <text x="84" y="344" font-size="12.5" fill="#333">Nodo raíz (uno solo por organización)</text>
  <rect x="330" y="330" width="18" height="18" rx="3" class="ou"/>
  <text x="354" y="344" font-size="12.5" fill="#333">Unidad organizativa (agrupa cuentas)</text>
  <rect x="600" y="330" width="18" height="18" rx="3" class="account"/>
  <text x="624" y="344" font-size="12.5" fill="#333">Cuenta AWS individual</text>

  <text x="410" y="375" text-anchor="middle" font-size="12" fill="#555">Las políticas de control de servicios (SCP) y la facturación se aplican en cualquier nivel de este árbol.</text>
</svg>
